<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Precision Production</title><meta name="description" content="Precision ATV production control"><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script></head><body>
<div id="auth" class="auth"><form id="authForm" class="auth-card"><div class="logo"><b>P</b><span><strong>Precision</strong><small>Production</small></span></div><p class="eyebrow">PRECISION ATV</p><h1 id="authTitle">Sign in</h1><p id="authCopy">Shared production control for the shop.</p><label id="nameWrap" hidden>Name<input id="authName" autocomplete="name"></label><label>Email<input id="authEmail" type="email" required autocomplete="email"></label><label>Password<input id="authPass" type="password" minlength="6" required autocomplete="current-password"></label><button class="btn primary" id="authSubmit">Sign in</button><button type="button" class="link" id="authMode">First time here? Create account</button><div id="authMsg" class="msg" hidden></div></form></div>
<div id="app" class="shell" hidden><aside><div class="logo"><b>P</b><span><strong>Precision</strong><small>Production</small></span></div><nav id="nav"><button data-view="schedule">Production Schedule</button><button data-view="calendar">Calendar</button><button data-view="materials" class="manager">Inventory & Machining</button><button data-view="machinist" class="manager">Machinist Schedule</button><button data-view="notifications" class="manager">Customer Updates <i id="emailCount">0</i></button><button data-view="mywork" class="tech">My Work</button><button data-view="blocked">Blocked</button><button data-view="approvals" class="manager">Approvals <i id="approvalCount">0</i></button><button data-view="completed">Completed</button><button data-view="team" class="owner">Team</button></nav><div class="rule"><b>Production rule</b><span>Warranty first. Otherwise customer work runs in invoice order. PATV/internal work stays separate.</span></div></aside>
<main><header><div><p class="eyebrow">PRECISION ATV</p><h1 id="title">Production Schedule</h1></div><div class="head-actions"><span id="sync" class="sync">Live</span><button class="btn manager" id="newJob">+ Order</button><div class="who"><strong id="whoName">—</strong><small id="whoRole">—</small></div><button class="btn ghost" id="logout">Sign out</button></div></header><section id="content"></section></main></div>
<div id="modal" class="backdrop" hidden><form id="jobForm" class="modal"><div class="modal-head"><div><p class="eyebrow">NEW MANUFACTURING ORDER</p><h2>Add job</h2></div><button type="button" class="icon" data-close>×</button></div><div class="grid"><label>List<select name="productionClass"><option value="customer">Customer</option><option value="patv">PATV / Internal</option></select></label><label>Type<select name="jobType"><option>E-Commerce</option><option>Local</option><option>Dealer</option><option>Warranty</option><option>Stock / Internal</option></select></label><label>Invoice #<input name="invoice" required placeholder="#1297"></label><label>Order date<input name="orderDate" type="date" required></label><label>Customer<input name="customer" required></label><label>Email<input name="customerEmail" type="email"></label><label>Customer phone<input name="customerPhone" type="tel" placeholder="3466981155"></label><label><span>SMS updates</span><span style="display:flex;gap:8px;align-items:center;margin-top:10px"><input name="smsOptIn" type="checkbox" style="width:auto"> Customer consent recorded</span></label><label class="wide">Engine / application<input name="engine" required placeholder="2019 Polaris RZR XP 1000"></label><label>VIN / serial<input name="vin"></label><label>Planned date<input name="plannedDate" type="date"></label><label>Stage<select name="stage" id="stageSelect"></select></label><label class="wide">Notes<textarea name="notes" rows="3"></textarea></label></div><div class="actions"><button type="button" class="btn ghost" data-close>Cancel</button><button class="btn primary">Create order</button></div></form></div>
<div id="drawer" class="drawer" hidden><div id="drawerBody"></div></div>
<div id="toast" class="toast" hidden></div>
<script src="config.js"></script><script src="cloud.js"></script><script src="ui.js"></script><script src="app.js"></script></body></html>
