<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Precision ATV Admin</title><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="/styles.css"></head><body>
<nav class="nav"><div class="wrap"><a class="brand" href="/">PRECISION <span>ATV</span></a><div class="navlinks"><a href="/">Back to storefront</a></div></div></nav>
<section class="admin-login"><div class="wrap"><div class="authbox admin-card"><div class="kicker">Owner access</div><h1>Precision ATV Admin</h1><p class="muted">Sign in to view private store, traffic, and SEO reporting.</p><form id="loginForm"><label class="field-label" for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" placeholder="Admin password" required><button id="loginBtn" class="btn" type="submit">Sign in</button><p id="err" class="muted"></p></form></div></div></section>
<script>
(async()=>{try{const r=await fetch('/api/metrics',{cache:'no-store'});if(r.ok)location.replace('/admin/dashboard')}catch{}})();
document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const btn=document.getElementById('loginBtn'),err=document.getElementById('err');btn.disabled=true;btn.textContent='Signing in…';err.textContent='';try{const r=await fetch('/api/admin-login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:document.getElementById('password').value})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Unable to sign in');location.replace('/admin/dashboard')}catch(x){err.textContent=x.message;btn.disabled=false;btn.textContent='Sign in'}});
</script></body></html>
