<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shop Reman Engines & Powersports Parts | Precision ATV</title><meta name="description" content="Shop Precision ATV remanufactured Polaris and Can-Am engines, rebuild kits, ECU tuning and powersports accessories."><link rel="canonical" href="https://www.precisionatv.com/shop"><link rel="stylesheet" href="/styles.css"></head><body>
<div class="topbar"><div class="wrap"><div>CONROE, TEXAS • BUILT FOR THE RIDE</div><div><a href="tel:+19362287655">(936) 228-7655</a></div></div></div><nav class="nav"><div class="wrap"><a class="brand" href="/">PRECISION <span>ATV</span></a><div class="navlinks"><a href="/shop">Shop</a><a href="/services">Service & Repair</a><a href="/">Our Shop</a><a href="/analytics">Analytics</a></div></div></nav>
<header class="page-hero"><div class="wrap"><div class="kicker">Shop Precision ATV</div><h1>THE RIGHT PARTS.<br>FOR YOUR NEXT RIDE.</h1><p class="muted">Live Shopify catalog when connected. Checkout remains Shopify-powered.</p></div></header>
<section><div class="wrap"><div style="display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap"><div class="filters"><button class="chip active" data-filter="all">All products</button><button class="chip" data-filter="engine">Engines</button><button class="chip" data-filter="part">Parts & kits</button><button class="chip" data-filter="ecu">ECU tuning</button><button class="chip" data-filter="access">Accessories</button></div><input class="search" id="search" placeholder="Search Polaris, Can-Am, RZR…"></div><div id="shopNotice" class="notice" hidden></div><div id="catalog" class="product-grid"></div></div></section>
<footer class="footer"><div class="wrap footer-grid"><div class="brand">PRECISION <span>ATV</span></div><div>1801 N Loop 336 E • Conroe, TX 77301 • (936) 228-7655</div></div></footer><script src="/site.js"></script><script>
let products=[],filter='all';
function category(p){const s=((p.productType||'')+' '+p.title).toLowerCase();if(s.includes('ecu')||s.includes('reflash'))return'ecu';if(s.includes('engine'))return'engine';if(s.includes('access')||s.includes('winch')||s.includes('diff'))return'access';return'part'}
function render(){const q=document.getElementById('search').value.toLowerCase();const list=products.filter(p=>(filter==='all'||category(p)===filter)&&p.title.toLowerCase().includes(q));document.getElementById('catalog').innerHTML=list.map(p=>`<article class="product">${p.image?`<div class="product-media"><img src="${p.image}" alt="${p.title.replace(/"/g,'&quot;')}"></div>`:`<div class="product-media">${(p.vendor||'PRECISION ATV').toUpperCase()}</div>`}<div class="product-body"><div class="product-type">${p.productType||category(p)}</div><div class="product-title">${p.title}</div><div class="price">${money(p.price,p.currency)}</div><button class="btn" ${p.variantId?'':'disabled'} onclick="buy('${p.variantId||''}','${p.title.replace(/'/g,"\\'")}',${Number(p.price||0)})">${p.variantId?'Buy through Shopify':'View current store'}</button></div></article>`).join('')||'<div class="notice" style="grid-column:1/-1">No matching products.</div>'}
async function buy(variantId,title,price){if(!variantId){location.href='https://precisionatvfab.com/collections/all';return}track('add_to_cart',{currency:'USD',value:price,items:[{item_id:variantId,item_name:title,price}]});const r=await fetch('/api/cart',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({variantId,quantity:1})});const d=await r.json();if(d.checkoutUrl){track('begin_checkout',{currency:'USD',value:price,items:[{item_id:variantId,item_name:title,price}]});location.href=d.checkoutUrl}else alert(d.error||'Unable to start checkout')}
(async()=>{const r=await fetch('/api/products?first=100');const d=await r.json();products=d.products||[];if(d.mode!=='shopify'){const n=document.getElementById('shopNotice');n.hidden=false;n.textContent='Preview catalog mode. Add the Shopify Storefront API token in Vercel to activate live inventory, images, variants and checkout.'}render()})();
document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;render()});document.getElementById('search').oninput=render;
</script></body></html>
